<mat-sidenav-container class="h-screen">
  <!-- Sidebar -->
  <mat-sidenav #drawer mode="side" opened class="w-64">
    <!-- <div class="p-4 text-xl font-bold">
      MyApp
    </div> -->

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/payments">
        <mat-icon matListItemIcon>account_balance</mat-icon>
        <span matListItemTitle>Payments</span>
      </a>

      <a mat-list-item routerLink="/ledger">
        <mat-icon matListItemIcon>checkbook</mat-icon>
        <span matListItemTitle>Ledger</span>
      </a>

      <a mat-list-item routerLink="/profile">
        <mat-icon matListItemIcon>account_circle</mat-icon>
        <span matListItemTitle>Profile</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content>
    <button mat-icon-button (click)="drawer.toggle()">
      <mat-icon class="cursor-pointer">menu</mat-icon>
    </button>

    <span class="ml-2">Admin Panel</span>

    <div class="p-6">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
