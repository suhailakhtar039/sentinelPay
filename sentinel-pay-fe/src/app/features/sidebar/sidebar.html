<mat-sidenav-container class="sidebar-layout">
  <!-- Sidebar -->
  <mat-sidenav #drawer mode="side" opened class="w-64">
    <div class="sidebar-container">
      <!-- Branding -->
      <div class="px-5 py-6 border-b">
        <h2 class="text-xl font-bold">SentinelPay</h2>
        <p class="text-sm text-gray-500">FinTech Platform</p>
      </div>

      <!-- Navigation -->
      <mat-nav-list class="px-3 pt-4">
        <a
          mat-list-item
          routerLink="/dashboard"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>

        <a mat-list-item routerLink="/payments" routerLinkActive="active-link">
          <mat-icon matListItemIcon>payments</mat-icon>
          <span matListItemTitle>Payments</span>
        </a>

        <a mat-list-item routerLink="/ledger" routerLinkActive="active-link">
          <mat-icon matListItemIcon>receipt_long</mat-icon>
          <span matListItemTitle>Ledger</span>
        </a>

        <a mat-list-item routerLink="/profile" routerLinkActive="active-link">
          <mat-icon matListItemIcon>person</mat-icon>
          <span matListItemTitle>Profile</span>
        </a>
      </mat-nav-list>

      <!-- Push logout to bottom -->
      <div class="flex-grow"></div>

      <div class="mt-auto p-3 border-t">
        <button class="logout-btn" (click)="logout()" title="Logout">
          <mat-icon>logout</mat-icon>

          <span>Logout</span>
        </button>
      </div>
    </div>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content>
    <div class="p-6">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
