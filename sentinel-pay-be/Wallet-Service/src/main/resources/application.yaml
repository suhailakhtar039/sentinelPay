spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:mysql://localhost:3306/sentinelpay
    username: root
    password: suhail

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: wallet-group
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring:
          json:
            trusted:
              packages: "*"
            value:
              default:
                type: com.sentinelpay.common.event.UserRegisteredEvent
            use:
              type:
                headers: false

server:
  port: 8082