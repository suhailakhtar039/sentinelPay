services:

  ############################################################
  # MySQL
  ############################################################

  mysql:
    image: mysql:8.4
    container_name: mysql

    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: sentinelpay

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sentinelpay-network

  ############################################################
  # ZooKeeper
  ############################################################

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper

    restart: unless-stopped

    ports:
      - "2181:2181"

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/localhost/2181' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sentinelpay-network

  ############################################################
  # Kafka
  ############################################################

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka

    restart: unless-stopped

    depends_on:
      zookeeper:
        condition: service_healthy

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sentinelpay-network

  ############################################################
  # Redis
  ############################################################

  redis:
    image: redis:7.2-alpine
    container_name: redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sentinelpay-network

  ############################################################
  # Auth Service
  ############################################################

  auth-service:
    image: sentinelpay/auth-service:1.0
    container_name: auth-service

    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - .env.docker

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8081:8081"

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sentinelpay-network

  ############################################################
  # Wallet Service
  ############################################################

  wallet-service:
    image: sentinelpay/wallet-service:1.0
    container_name: wallet-service

    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - .env.docker

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8082:8082"

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sentinelpay-network

  ############################################################
  # Payment Service
  ############################################################

  payment-service:
    image: sentinelpay/payment-service:1.0
    container_name: payment-service

    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - .env.docker

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8083:8083"

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sentinelpay-network

  ############################################################
  # Fraud Service
  ############################################################

  fraud-service:
    image: sentinelpay/fraud-service:1.0
    container_name: fraud-service

    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - .env.docker

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8084:8084"

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sentinelpay-network

  ############################################################
  # Notification Service
  ############################################################

  notification-service:
    image: sentinelpay/notification-service:1.0
    container_name: notification-service

    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - .env.docker

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

    ports:
      - "8085:8085"

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sentinelpay-network

  ############################################################
  # Ledger Service
  ############################################################

  ledger-service:
    image: sentinelpay/ledger-service:1.0
    container_name: ledger-service

    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - .env.docker

    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

    ports:
      - "8086:8086"

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sentinelpay-network

  ############################################################
  # API Gateway
  ############################################################

  api-gateway:
    image: sentinelpay/api-gateway:1.0
    container_name: api-gateway

    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - .env.docker

    depends_on:
      auth-service:
        condition: service_started
      wallet-service:
        condition: service_started
      payment-service:
        condition: service_started
      fraud-service:
        condition: service_started
      notification-service:
        condition: service_started
      ledger-service:
        condition: service_started

    ports:
      - "8080:8080"

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - sentinelpay-network

############################################################
# Volumes
############################################################

volumes:
  mysql-data:
  redis-data:

############################################################
# Network
############################################################

networks:
  sentinelpay-network:
    driver: bridge