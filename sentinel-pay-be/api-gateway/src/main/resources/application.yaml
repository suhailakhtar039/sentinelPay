server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/auth/**

            - id: auth-service-user
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/users/**

            - id: wallet-service
              uri: ${WALLET_SERVICE_URL}
              predicates:
                - Path=/api/wallets/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/api/payments/**

            - id: payment-service-user
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/api/analytics/**

            - id: payment-service-dashboard
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/api/dashboard/**

            - id: ledger-service
              uri: ${LEDGER_SERVICE_URL}
              predicates:
                - Path=/api/ledger/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_URL:http://localhost:4200}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

auth:
  service:
    url: ${AUTH_SERVICE_URL}