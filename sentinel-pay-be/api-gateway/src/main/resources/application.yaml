server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          routes:

            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: wallet-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/wallets/**

            - id: payment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/payments/**

            - id: ledger-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/ledger/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

auth:
  service:
    url: http://localhost:8081