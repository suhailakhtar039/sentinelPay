name: Frontend CI/CD

on:
  push:
    branches:
      - master
    paths:
      - "sentinel-pay-fe/**"

  pull_request:
    branches:
      - master
    paths:
      - "sentinel-pay-fe/**"

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sentinel-pay-fe

    steps:

      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Setup Node
      ####################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sentinel-pay-fe/package-lock.json

      ####################################################
      # Install Dependencies
      ####################################################

      - name: Install Dependencies
        run: npm ci

      ####################################################
      # Build Angular
      ####################################################

      - name: Build Angular
        run: npm run build

      ####################################################
      # Verify Build Output
      ####################################################

      - name: Verify Build Output
        run: ls -R dist

      ####################################################
      # Login to Docker Hub
      ####################################################

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ####################################################
      # Build Docker Image
      ####################################################

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/frontend:1.0 \
            .

      ####################################################
      # Push Docker Image
      ####################################################

      - name: Push Frontend Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/frontend:1.0